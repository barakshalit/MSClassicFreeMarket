<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maple Market Database</title>
  
  <!-- DataTables CSS for awesome sorting/searching -->
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f4f9; padding: 20px; }
    .container { max-width: 1000px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    h1 { text-align: center; color: #333; }
    .status-sold { color: white; background: #e74c3c; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: bold;}
    .status-listed { color: white; background: #2ecc71; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: bold;}
    .price-cell { font-weight: bold; color: #2c3e50; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Maple Market Database</h1>
    <p id="loading">Loading database...</p>
    
    <table id="marketTable" class="display" style="width:100%; display:none;">
      <thead>
        <tr>
          <th>Date Scanned</th>
          <th>Item Name</th>
          <th>Price (Mesos)</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <!-- Data will be injected here -->
      </tbody>
    </table>
  </div>

  <!-- jQuery and DataTables JS -->
  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

  <script>
    // --- PASTE YOUR GOOGLE APPS SCRIPT URL HERE ---
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzi0DtITK72GoFRp6xxUeM-eloor71DSxXJJ_1eb1CjFj6WahcGyMo1ubaWCaSsqQ23/exec";

    async function loadData() {
      try {
        document.getElementById('loading').innerText = "Fetching data... (If this hangs, check F12 Console)";
        
        const response = await fetch(SCRIPT_URL);
        
        // Read the raw response text before trying to parse it as JSON
        const rawText = await response.text();
        
        let data;
        try {
          // Attempt to parse the text into a JSON object
          data = JSON.parse(rawText);
        } catch (parseError) {
          // If it fails, print exactly what Google sent back to the screen
          document.getElementById('loading').innerHTML = `
            <div style="color: #e74c3c; background: #fadbd8; padding: 10px; border-radius: 5px;">
              <b>Data Formatting Error:</b> Expected JSON but received the text below. 
              If this looks like an HTML page, your Apps Script access is not set to "Anyone".
            </div>
            <textarea style="width: 100%; height: 200px; margin-top: 10px; font-family: monospace;">${rawText}</textarea>
          `;
          console.error("Raw response from Google:", rawText);
          return;
        }
        
        const tbody = document.getElementById('tableBody');
        
        data.forEach(row => {
          if (!row.name) return; 
          
          const tr = document.createElement('tr');
          const date = new Date(row.date).toLocaleDateString() + " " + new Date(row.date).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
          const formattedPrice = Number(row.price).toLocaleString();
          const statusBadge = row.status === "SOLD" 
            ? `<span class="status-sold">SOLD</span>` 
            : `<span class="status-listed">LISTED</span>`;

          tr.innerHTML = `
            <td>${date}</td>
            <td><strong>${row.name}</strong></td>
            <td class="price-cell" data-sort="${row.price}">${formattedPrice}</td>
            <td>${statusBadge}</td>
          `;
          tbody.appendChild(tr);
        });

        document.getElementById('loading').style.display = 'none';
        document.getElementById('marketTable').style.display = 'table';
        
        $('#marketTable').DataTable({
          "order": [[ 1, "asc" ], [ 2, "asc" ]],
          "pageLength": 50
        });

      } catch (error) {
        document.getElementById('loading').innerHTML = `
          <div style="color: red; font-weight: bold;">Network Error:</div>
          <p>${error.message}</p>
        `;
        console.error(error);
      }
    }

    loadData();
  </script>
</body>
</html>
